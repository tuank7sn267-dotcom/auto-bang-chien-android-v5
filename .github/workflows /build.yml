name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Tóm tắt lỗi biên dịch (chỉ chạy khi build hỏng)
        if: failure()
        shell: bash
        run: |
          echo "## Lỗi biên dịch" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^e: |What went wrong' -A2 build.log | head -80 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Các dòng lỗi (bắt đầu bằng 'e:') cũng được in ngay dưới đây và nằm ở mục Summary của lần chạy."
          grep -E '^e: ' build.log | head -40 || true

      - name: Lưu APK (tải ở mục Artifacts của lần chạy)
        uses: actions/upload-artifact@v4
        with:
          name: auto-bang-chien-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Đăng APK lên mục Releases (bản mới nhất)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Auto Bang Chiến - bản mới nhất
          body: Tải file app-debug.apk bên dưới rồi cài lên điện thoại.
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
